        <text x="300.5" y="118"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8493a9">33.8%</text>
      </g><g>
        <circle cx="365" cy="114" r="4" fill="#663399"/>
        <text x="376" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5"
          fill="#0c1424">CSS</text>
        <text x="404.7" y="118"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8493a9">5.9%</text>
      </g><g>
        <circle cx="462.3" cy="114" r="4" fill="#3572A5"/>
        <text x="473.3" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5"
          fill="#0c1424">Python</text>
        <text x="522.7" y="118"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8493a9">5.1%</text>
      </g><g>
        <circle cx="580.3" cy="114" r="4" fill="#000080"/>
        <text x="591.3" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5"
          fill="#0c1424">Lua</text>
        <text x="620" y="118"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8493a9">1.4%</text>
      </g><g>
        <circle cx="677.6" cy="114" r="4" fill="#ff3e00"/>
        <text x="688.6" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5"
          fill="#0c1424">Svelte</text>
        <text x="738" y="118"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8493a9">0.8%</text>
      </g><g>
        <circle cx="795.6" cy="114" r="4" fill="#5ee7ff"/>
        <text x="806.6" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5"
          fill="#0c1424">Other</text>
        <text x="849.1" y="118"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8493a9">0.7%</text>
      </g>

  <line x1="56" y1="142" x2="944" y2="142" stroke="#d3dcea" stroke-width="1"/>
  <text x="56" y="163" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="0.8"
    fill="#8493a9">3.3M bytes across 14 public repositories</text>
  <text x="944" y="163" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9"
    letter-spacing="1.4" fill="#8493a9">PRIMARY · TYPESCRIPT</text>
</svg>