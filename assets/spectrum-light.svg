<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180"
  role="img" aria-label="Language distribution across public repositories, measured in bytes of code">
  <title>Language spectrum — TypeScript leads with 52.2%</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7fc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect x="56" y="56" width="888" height="28" rx="14"/>
    </clipPath>
  </defs>

  <style>
    /* The wipe is a transform, not a clip, so the bar degrades to fully drawn
       wherever CSS animation does not run instead of vanishing. */
    @keyframes wipe { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 0.92 } }
    .wipe { animation: wipe 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.15s backwards;
            transform-box: fill-box; transform-origin: left center }
    .fade { animation: fadeIn 0.7s ease-out 0.9s backwards }
    @media (prefers-reduced-motion: reduce) {
      .wipe, .fade { animation: none }
    }
  </style>

  <rect width="1000" height="180" rx="14" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="999" height="179" rx="14" fill="none"
    stroke="#d3dcea" stroke-width="1"/>

  <text x="56" y="36" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2.6"
    fill="#5c6b83">LANGUAGE SPECTRUM — MEASURED IN BYTES OF CODE</text>
  <text x="944" y="36" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10"
    letter-spacing="1.4" fill="#8493a9">12 LANGUAGES DETECTED</text>

  <rect x="56" y="56" width="888" height="28" rx="14"
    fill="#eef2f9" stroke="#d3dcea" stroke-width="1"/>
  <g clip-path="url(#rounded)">
    <g class="wipe"><rect x="56" y="56" width="461.85" height="28"
          fill="#3178c6"/><rect x="519.85" y="56" width="298.31" height="28"
          fill="#f1e05a"/><rect x="820.16" y="56" width="50" height="28"
          fill="#663399"/><rect x="872.16" y="56" width="43.31" height="28"
          fill="#3572A5"/><rect x="917.47" y="56" width="10.46" height="28"
          fill="#000080"/><rect x="929.93" y="56" width="5.45" height="28"
          fill="#ff3e00"/><rect x="937.38" y="56" width="4.63" height="28"
          fill="#5ee7ff"/></g>
    <g class="fade"><text x="286.9" y="73.6"
        text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700"
        fill="#ffffff"
        >52.2%</text><text x="669" y="73.6"
        text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700"
        fill="#08101f"
        >33.8%</text></g>
  </g>

  <g>
        <circle cx="60" cy="114" r="4" fill="#3178c6"/>
        <text x="71" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5"
          fill="#0c1424">TypeScript</text>
        <text x="148" y="118"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8493a9">52.2%</text>
      </g><g>
        <circle cx="212.5" cy="114" r="4" fill="#f1e05a"/>
        <text x="223.5" y="118" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5"
